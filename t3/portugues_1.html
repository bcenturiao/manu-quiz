<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Português: Verbos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7c3aed;
    --purple-dark: #6d28d9;
    --purple-light: #ede9fe;
    --yellow-light: #fef9c3;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #ddd6fe;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--purple-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--purple); }
  .score-pill {
    background: var(--purple-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--purple), #c4b5fd);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--purple);
    background: var(--purple-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: #dcfce7; border: 2px solid #16a34a; }
  .fb-header { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: #15803d; }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #15803d; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--purple-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #5b21b6; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--purple-dark); margin-bottom: 6px; }
  .result-count { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--purple-light);
    border: 6px solid var(--purple);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--purple-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--purple-dark); font-weight: 700; }
  .result-msg { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--purple-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--purple-dark); margin-bottom: 8px; }
  .start-title span { color: var(--purple); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; font-family: 'Nunito', sans-serif; }
  .start-btn {
    background: var(--purple-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #5b21b6; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
  .q-text b { color: #6d28d9; }
  .q-label b { color: #6d28d9; font-size: 15px; }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 🏃</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const INFINITIVO = [
  { opcoes: ["correr","lápis","bonito","chuva"],      resposta: "correr",   term: "-ER" },
  { opcoes: ["caderno","sorriu","estudar","feliz"],   resposta: "estudar",  term: "-AR" },
  { opcoes: ["janela","comeu","verde","partir"],      resposta: "partir",   term: "-IR" },
  { opcoes: ["mesa","comer","pulou","alto"],          resposta: "comer",    term: "-ER" },
  { opcoes: ["brincar","bola","dormiu","amarelo"],    resposta: "brincar",  term: "-AR" },
  { opcoes: ["cama","cantou","pequeno","dormir"],     resposta: "dormir",   term: "-IR" },
  { opcoes: ["escola","escrever","leu","rápido"],     resposta: "escrever", term: "-ER" },
  { opcoes: ["flor","andou","sorrir","doce"],         resposta: "sorrir",   term: "-IR" },
];

const TEMPO = [
  { frase: "Ontem eu comi um bolo de chocolate muito gostoso.",  verbo: "comi",        resposta: "Passado",  dica: "já aconteceu (ontem)" },
  { frase: "Os alunos jogam futebol na quadra da escola.",       verbo: "jogam",       resposta: "Presente", dica: "está acontecendo agora" },
  { frase: "Amanhã nós visitaremos a vovó no sítio.",            verbo: "visitaremos", resposta: "Futuro",   dica: "ainda vai acontecer (amanhã)" },
  { frase: "A professora explicou a lição na semana passada.",   verbo: "explicou",    resposta: "Passado",  dica: "já aconteceu (semana passada)" },
  { frase: "Na próxima semana, eu farei uma viagem.",            verbo: "farei",       resposta: "Futuro",   dica: "ainda vai acontecer (próxima semana)" },
  { frase: "O cachorro brinca com a bola no quintal.",           verbo: "brinca",      resposta: "Presente", dica: "está acontecendo agora" },
  { frase: "Anteontem choveu muito na cidade.",                  verbo: "choveu",      resposta: "Passado",  dica: "já aconteceu (anteontem)" },
  { frase: "Amanhã as crianças irão ao cinema.",                 verbo: "irão",        resposta: "Futuro",   dica: "ainda vai acontecer (amanhã)" },
];

const TIPO_VERBO = [
  { frase: "O menino <b>pulou</b> o muro da escola.",             resposta: "Ação" },
  { frase: "A professora <b>estava</b> muito orgulhosa da turma.", resposta: "Estado" },
  { frase: "<b>Choveu</b> bastante durante toda a madrugada.",     resposta: "Fenômeno da natureza" },
  { frase: "Marina <b>lê</b> um livro de aventuras.",              resposta: "Ação" },
  { frase: "<b>Ventou</b> forte perto da praia.",                  resposta: "Fenômeno da natureza" },
  { frase: "O bebê <b>é</b> muito tranquilo.",                     resposta: "Estado" },
  { frase: "<b>Nevou</b> nas montanhas do sul.",                   resposta: "Fenômeno da natureza" },
  { frase: "O cachorro <b>correu</b> atrás da bola.",              resposta: "Ação" },
];
const EXPLICA_TIPO = {
  "Ação": "alguém faz alguma coisa.",
  "Estado": "diz como alguém está ou é.",
  "Fenômeno da natureza": "chuva, vento, neve, trovão…",
};

// ── QUIZ ──────────────────────────────────────────────────────────────
const QUIZ = {
  emoji: "🏃",
  titleHtml: "Verbos em <span>Ação!</span>",
  sub: "Encontre o infinitivo, descubra o tempo verbal e diga o que cada verbo indica!",
  facts: ["🏃 8 infinitivo", "⏰ 8 tempo verbal", "🌧️ 8 tipo de verbo"],
  perfectMsg: "Perfeito! Você domina os verbos! 🌟",
};

const SECTIONS = [
  {
    label: "Infinitivo",
    items: INFINITIVO,
    question: it => card("Qual destas palavras é um verbo no INFINITIVO?"),
    options: it => it.opcoes,
    answer: it => it.resposta,
    feedback: it => `✓ ${it.resposta.toUpperCase()} termina em ${it.term}: é o nome do verbo, do jeito que aparece no dicionário.`,
    grid: true,
    transition: { emoji: "⏰", sub: "Agora: passado, presente ou futuro?" },
  },
  {
    label: "Tempo verbal",
    items: TEMPO,
    question: it => card("Essa frase está no…", qtext(it.frase)),
    options: it => ["Passado", "Presente", "Futuro"],
    answer: it => it.resposta,
    feedback: it => `✓ ${it.resposta} — "${it.verbo}": ${it.dica}.`,
    transition: { emoji: "🌧️", sub: "Agora: o verbo indica ação, estado ou fenômeno da natureza?" },
  },
  {
    label: "Tipo de verbo",
    items: TIPO_VERBO,
    question: it => card("O verbo destacado indica…", qtext(it.frase)),
    options: it => ["Ação", "Estado", "Fenômeno da natureza"],
    answer: it => it.resposta,
    feedback: it => `✓ ${it.resposta} — ${EXPLICA_TIPO[it.resposta]}`,
  },
];

// ── ENGINE (compartilhado pelos quizzes T3) ───────────────────────────
let sec = 0, cur = 0, score = 0, won = false, correctCount = 0;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;');
const card = (label, body = '') => `<div class="q-card"><div class="q-label">${label}</div>${body}</div>`;
const qtext = t => `<div class="q-text">${t}</div>`;
const bigWord = (t, size = 40) => `<div style="font-family:'Fredoka One',cursive;font-size:${size}px;text-align:center;margin:16px 0;color:#6d28d9;line-height:1.2">${t}</div>`;

function totalQuestions() { return SECTIONS.reduce((a, s) => a + s.items.length, 0); }
function doneBefore(s) { let n = 0; for (let i = 0; i < s; i++) n += SECTIONS[i].items.length; return n; }

function render() {
  const S = SECTIONS[sec], item = S.items[cur];
  const pct = Math.round((doneBefore(sec) + cur) / totalQuestions() * 100);
  const opts = S.options(item).map(op =>
    `<button class="opt-btn" data-op="${esc(op)}" onclick="clickOpt(this)">${op}</button>`).join('');
  const last = cur === S.items.length - 1;
  const nextLabel = last ? (sec === SECTIONS.length - 1 ? 'Ver resultado →' : 'Próxima parte →') : 'Próxima →';
  const gridStyle = S.grid ? ' style="display:grid;grid-template-columns:1fr 1fr;gap:10px"' : '';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">${S.label} ${cur + 1} de ${S.items.length}</div>
    ${S.question(item)}
    <div class="options"${gridStyle}>${opts}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextQ()">${nextLabel}</button>`;
  if (typeof window !== 'undefined') window.scrollTo(0, 0);
}

function clickOpt(btn) {
  if (won) return;
  const S = SECTIONS[sec], item = S.items[cur];
  if (btn.dataset.op === S.answer(item)) {
    won = true; score += 10; correctCount++;
    document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    const fb = document.getElementById('fb');
    fb.className = 'feedback-panel show ok';
    fb.innerHTML = `<div class="fb-header">${S.feedback(item)}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    document.querySelectorAll('.opt-btn').forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextQ() {
  cur++; won = false;
  if (cur < SECTIONS[sec].items.length) { render(); return; }
  if (sec < SECTIONS.length - 1) showTransition(); else showResult();
}

function showTransition() {
  const t = SECTIONS[sec].transition;
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">${t.emoji}</span>
        <div class="transition-title">Mandou bem!</div>
        <div class="transition-sub">${t.sub}</div>
      </div>
      <button class="continue-btn" onclick="startSection()">Continuar →</button>
    </div>`;
}

function startSection() { sec++; cur = 0; won = false; render(); }

function showResult() {
  const total = totalQuestions(), correct = correctCount;
  let msg;
  if (correct === total)           msg = QUIZ.perfectMsg;
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

function startScreen() {
  sec = 0; cur = 0; score = 0; won = false; correctCount = 0;
  document.getElementById('score-val').textContent = 0;
  const facts = QUIZ.facts.map(f => `<div class="start-fact">${f}</div>`).join('');
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">${QUIZ.emoji}</span>
      <div class="start-title">${QUIZ.titleHtml}</div>
      <div class="start-sub">${QUIZ.sub}</div>
      <div class="start-facts">${facts}</div>
      <button class="start-btn" onclick="render()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
</body>
</html>
