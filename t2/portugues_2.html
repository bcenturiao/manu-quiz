<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Português: Classes de Palavras</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7c3aed;
    --purple-dark: #6d28d9;
    --purple-light: #ede9fe;
    --yellow-light: #fef9c3;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #ddd6fe;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--purple-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--purple); }
  .score-pill {
    background: var(--purple-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--purple), #c4b5fd);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--purple);
    background: var(--purple-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: #dcfce7; border: 2px solid #16a34a; }
  .fb-header { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: #15803d; }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #15803d; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--purple-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #5b21b6; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--purple-dark); margin-bottom: 6px; }
  .result-count { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--purple-light);
    border: 6px solid var(--purple);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--purple-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--purple-dark); font-weight: 700; }
  .result-msg { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--purple-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--purple-dark); margin-bottom: 8px; }
  .start-title span { color: var(--purple); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; font-family: 'Nunito', sans-serif; }
  .start-btn {
    background: var(--purple-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #5b21b6; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 📝</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const SUBSTANTIVOS = [
  { pergunta: "Que tipo de substantivo é cachorro?", resposta: "Comum",    opcoes: ["Comum","Próprio","Composto"], dica: "Cachorro é o nome genérico de um animal." },
  { pergunta: "Que tipo de substantivo é Brasil?",   resposta: "Próprio",  opcoes: ["Comum","Próprio","Composto"], dica: "Brasil é o nome específico de um país." },
  { pergunta: "Que tipo de substantivo é girassol?", resposta: "Composto", opcoes: ["Comum","Próprio","Composto"], dica: "Girassol = girar + sol. Duas palavras juntas!" },
  { pergunta: "Que tipo de substantivo é Maria?",    resposta: "Próprio",  opcoes: ["Comum","Próprio","Composto"], dica: "Maria é o nome de uma pessoa específica." },
  { pergunta: "Que tipo de substantivo é beija-flor?",resposta:"Composto", opcoes: ["Comum","Próprio","Composto"], dica: "Beija-flor = beijar + flor. Duas ideias juntas!" },
  { pergunta: "Que tipo de substantivo é cidade?",   resposta: "Comum",    opcoes: ["Comum","Próprio","Composto"], dica: "Cidade é o nome genérico de um lugar urbano." },
  { pergunta: "Que tipo de substantivo é Pedro?",    resposta: "Próprio",  opcoes: ["Comum","Próprio","Composto"], dica: "Pedro é o nome de uma pessoa específica." },
  { pergunta: "Que tipo de substantivo é passatempo?",resposta:"Composto", opcoes: ["Comum","Próprio","Composto"], dica: "Passatempo = passar + tempo. Duas palavras!" },
];

const ARTIGOS_PRONOMES = [
  { pergunta: 'O artigo destacado em "O menino foi à escola" é:', palavra: "O", resposta: "Definido",   opcoes: ["Definido","Indefinido"], dica: "O, A, Os, As são artigos definidos — indicam algo específico." },
  { pergunta: 'O artigo destacado em "Ela comeu uma maçã" é:',    palavra: "uma", resposta: "Indefinido", opcoes: ["Definido","Indefinido"], dica: "Um, Uma, Uns, Umas são artigos indefinidos — algo inespecífico." },
  { pergunta: 'O artigo destacado em "A menina brincou no parque" é:', palavra: "A", resposta: "Definido", opcoes: ["Definido","Indefinido"], dica: "A é artigo definido feminino singular." },
  { pergunta: 'O artigo destacado em "Ele tem um cachorro" é:',   palavra: "um", resposta: "Indefinido", opcoes: ["Definido","Indefinido"], dica: "Um é artigo indefinido masculino singular." },
  { pergunta: "Qual pronome completa: ___ gosto de sorvete.", resposta: "Eu",   opcoes: ["Eu","Tu","Ele","Nós"],  dica: "Eu é o pronome da 1ª pessoa do singular." },
  { pergunta: "Qual pronome completa: ___ brincamos no parque.", resposta: "Nós", opcoes: ["Eu","Tu","Nós","Eles"], dica: "Nós é o pronome da 1ª pessoa do plural." },
  { pergunta: "Qual pronome completa: ___ estudam português.", resposta: "Elas", opcoes: ["Eu","Ele","Elas","Tu"], dica: "Elas é o pronome da 3ª pessoa do plural feminino." },
  { pergunta: "Qual pronome completa: ___ tem um gato em casa.", resposta: "Ela", opcoes: ["Nós","Ela","Eu","Eles"], dica: "Ela é o pronome da 3ª pessoa do singular feminino." },
];

const ADJETIVOS = [
  { frase: "O gato preto dormiu na cama.",                 resposta: "preto",       opcoes: ["gato","preto","dormiu","cama"],                  tipo: "Cor" },
  { frase: "O cachorro grande latiu muito.",               resposta: "grande",      opcoes: ["cachorro","grande","latiu","muito"],             tipo: "Tamanho" },
  { frase: "Ela tem um coração bondoso.",                  resposta: "bondoso",     opcoes: ["coração","bondoso","tem","ela"],                 tipo: "Qualidade" },
  { frase: "A menina feliz ganhou um presente.",           resposta: "feliz",       opcoes: ["menina","feliz","ganhou","presente"],            tipo: "Estado" },
  { frase: "O prédio alto tocava o céu.",                  resposta: "alto",        opcoes: ["prédio","alto","tocava","céu"],                  tipo: "Tamanho" },
  { frase: "Ela tem um vestido vermelho.",                 resposta: "vermelho",    opcoes: ["vestido","vermelho","tem","ela"],                tipo: "Cor" },
  { frase: "O cachorro estava cansado depois do passeio.", resposta: "cansado",     opcoes: ["cachorro","estava","cansado","passeio"],         tipo: "Estado" },
  { frase: "O menino inteligente resolveu o problema.",    resposta: "inteligente", opcoes: ["menino","inteligente","resolveu","problema"],    tipo: "Qualidade" },
];
const TIPOS_ADJETIVO = ["Cor", "Tamanho", "Qualidade", "Estado"];

// ── STATE ─────────────────────────────────────────────────────────────
let sec = 1, cur = 0, score = 0, won = false, correctCount = 0, adjStep = 'find';

// ── SECTION 1: SUBSTANTIVOS ──────────────────────────────────────────
function renderSubstantivo() {
  const item = SUBSTANTIVOS[cur];
  const total = SUBSTANTIVOS.length + ARTIGOS_PRONOMES.length + ADJETIVOS.length;
  const pct = Math.round((cur / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickSubst(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === SUBSTANTIVOS.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Substantivos ${cur+1} de ${SUBSTANTIVOS.length}</div>
    <div class="q-card">
      <div class="q-label">Identifique o substantivo:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextSubst()">${nextLabel}</button>`;
}

function clickSubst(btn, opcao) {
  if (won) return;
  const item = SUBSTANTIVOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! ${item.dica}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextSubst() {
  cur++; won = false;
  if (cur >= SUBSTANTIVOS.length) { showTransitionAP(); return; }
  renderSubstantivo();
}

// ── TRANSITION: ARTIGOS/PRONOMES ─────────────────────────────────────
function showTransitionAP() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">📌</span>
        <div class="transition-title">Ótimo!</div>
        <div class="transition-sub">Agora vamos para artigos e pronomes!</div>
      </div>
      <button class="continue-btn" onclick="startAP()">Continuar →</button>
    </div>`;
}

function startAP() { sec = 2; cur = 0; won = false; renderAP(); }

// ── SECTION 2: ARTIGOS E PRONOMES ────────────────────────────────────
function renderAP() {
  const item = ARTIGOS_PRONOMES[cur];
  const total = SUBSTANTIVOS.length + ARTIGOS_PRONOMES.length + ADJETIVOS.length;
  const pct = Math.round(((SUBSTANTIVOS.length + cur) / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickAP(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === ARTIGOS_PRONOMES.length - 1 ? 'Próxima parte →' : 'Próxima →';
  const wordHtml = item.palavra
    ? `<div style="font-family:'Fredoka One',cursive;font-size:32px;text-align:center;color:#6d28d9;margin:12px 0">"${item.palavra}"</div>`
    : '';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Artigos e Pronomes ${cur+1} de ${ARTIGOS_PRONOMES.length}</div>
    <div class="q-card">
      <div class="q-label">Identifique:</div>
      <div class="q-text">${item.pergunta}</div>
      ${wordHtml}
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextAP()">${nextLabel}</button>`;
}

function clickAP(btn, opcao) {
  if (won) return;
  const item = ARTIGOS_PRONOMES[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! ${item.dica}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextAP() {
  cur++; won = false;
  if (cur >= ARTIGOS_PRONOMES.length) { showTransitionAdj(); return; }
  renderAP();
}

// ── TRANSITION: ADJETIVOS ─────────────────────────────────────────────
function showTransitionAdj() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🌟</span>
        <div class="transition-title">Incrível!</div>
        <div class="transition-sub">Última parte: encontre o adjetivo na frase!</div>
      </div>
      <button class="continue-btn" onclick="startAdj()">Continuar →</button>
    </div>`;
}

function startAdj() { sec = 3; cur = 0; won = false; renderAdjetivo(); }

// ── SECTION 3: ADJETIVOS (2 passos: achar + classificar) ────────────
function renderAdjetivo() {
  const item = ADJETIVOS[cur];
  const total = SUBSTANTIVOS.length + ARTIGOS_PRONOMES.length + ADJETIVOS.length;
  const pct = Math.round(((SUBSTANTIVOS.length + ARTIGOS_PRONOMES.length + cur) / total) * 100);
  const nextLabel = cur === ADJETIVOS.length - 1 ? 'Ver resultado 🏆' : 'Próxima →';

  if (adjStep === 'find') {
    const optsHtml = item.opcoes.map(op =>
      `<button class="opt-btn" onclick="clickAdj(this,'${op}')">${op}</button>`
    ).join('');
    document.getElementById('app').innerHTML = `
      <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">Adjetivos ${cur+1} de ${ADJETIVOS.length}</div>
      <div class="q-card">
        <div class="q-label">Qual palavra é o adjetivo?</div>
        <div class="q-text" style="font-style:italic">"${item.frase}"</div>
      </div>
      <div class="options" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${optsHtml}</div>
      <div class="feedback-panel" id="fb"></div>
      <button class="next-btn" id="next-btn" onclick="nextAdj()">${nextLabel}</button>`;
  } else {
    const optsHtml = TIPOS_ADJETIVO.map(tp =>
      `<button class="opt-btn" onclick="clickAdjTipo(this,'${tp}')">${tp}</button>`
    ).join('');
    document.getElementById('app').innerHTML = `
      <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label">Adjetivos ${cur+1} de ${ADJETIVOS.length}</div>
      <div class="q-card">
        <div class="q-label">Que tipo de adjetivo é "${item.resposta}"?</div>
        <div class="q-text" style="font-style:italic">"${item.frase}"</div>
      </div>
      <div class="options" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${optsHtml}</div>
      <div class="feedback-panel" id="fb"></div>
      <button class="next-btn" id="next-btn" onclick="nextAdj()">${nextLabel}</button>`;
  }
}

function clickAdj(btn, opcao) {
  if (won) return;
  const item = ADJETIVOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    score += 10; document.getElementById('score-val').textContent = score;
    adjStep = 'classify';
    renderAdjetivo();
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function clickAdjTipo(btn, tipo) {
  if (won) return;
  const item = ADJETIVOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (tipo === item.tipo) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ "${item.resposta}" é um adjetivo de ${item.tipo}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextAdj() {
  cur++; won = false; adjStep = 'find';
  if (cur >= ADJETIVOS.length) { showResult(); return; }
  renderAdjetivo();
}

// ── RESULT SCREEN ─────────────────────────────────────────────────────
function showResult() {
  const total = SUBSTANTIVOS.length + ARTIGOS_PRONOMES.length + ADJETIVOS.length;
  const correct = correctCount;
  let msg;
  if (correct === total)           msg = "Perfeito! Você sabe tudo sobre classes de palavras! 🌟";
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

// ── START SCREEN ──────────────────────────────────────────────────────
function startScreen() {
  sec = 1; cur = 0; score = 0; won = false; correctCount = 0; adjStep = 'find';
  document.getElementById('score-val').textContent = 0;
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">📝</span>
      <div class="start-title">Classes de <span>Palavras!</span></div>
      <div class="start-sub">Descubra o tipo de cada palavra: substantivos, artigos, pronomes e adjetivos!</div>
      <div class="start-facts">
        <div class="start-fact">📦 8 substantivos</div>
        <div class="start-fact">📌 8 artigos/pronomes</div>
        <div class="start-fact">🌟 8 adjetivos</div>
      </div>
      <button class="start-btn" onclick="renderSubstantivo()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
</body>
</html>
