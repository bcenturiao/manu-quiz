<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Português: Verbos e Vocabulário</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #7c3aed;
    --purple-dark: #6d28d9;
    --purple-light: #ede9fe;
    --yellow-light: #fef9c3;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #ddd6fe;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--purple-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--purple); }
  .score-pill {
    background: var(--purple-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--purple), #c4b5fd);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--purple);
    background: var(--purple-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: #dcfce7; border: 2px solid #16a34a; }
  .fb-header { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: #15803d; }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #15803d; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--purple-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #5b21b6; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--purple-dark); margin-bottom: 6px; }
  .result-count { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--purple-light);
    border: 6px solid var(--purple);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--purple-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--purple-dark); font-weight: 700; }
  .result-msg { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--purple);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--purple-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--purple-dark); margin-bottom: 8px; }
  .start-title span { color: var(--purple); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; font-family: 'Nunito', sans-serif; }
  .start-btn {
    background: var(--purple-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #5b21b6; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 📖</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const VERBOS = [
  { frase: 'Ela __comeu__ macarrão no almoço.',           verbo: "comeu",      resposta: "Passado",  opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'Nós __vamos brincar__ no parque amanhã.',     verbo: "vamos brincar", resposta: "Futuro", opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'O menino __estuda__ todos os dias.',          verbo: "estuda",     resposta: "Presente", opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'Eu __ganhei__ um presente ontem.',            verbo: "ganhei",     resposta: "Passado",  opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'Ela __vai dormir__ cedo hoje à noite.',       verbo: "vai dormir", resposta: "Futuro",   opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'Eles __jogam__ futebol toda tarde.',          verbo: "jogam",      resposta: "Presente", opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'A professora __ensinou__ a matéria ontem.',   verbo: "ensinou",    resposta: "Passado",  opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'Nós __iremos__ ao zoológico no fim de semana.', verbo:"iremos",    resposta: "Futuro",   opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'O bebê __chora__ toda hora.',                 verbo: "chora",      resposta: "Presente", opcoes: ["Passado","Presente","Futuro"] },
  { frase: 'Maria __viajou__ para a praia nas férias.',   verbo: "viajou",     resposta: "Passado",  opcoes: ["Passado","Presente","Futuro"] },
];

const VOCABULARIO = [
  { tipo: "sinônimo",  palavra: "bonito",   resposta: "lindo",   opcoes: ["feio","lindo","triste","pequeno"],   emoji: "✨" },
  { tipo: "sinônimo",  palavra: "alegre",   resposta: "feliz",   opcoes: ["triste","bravo","feliz","cansado"],  emoji: "😊" },
  { tipo: "sinônimo",  palavra: "rápido",   resposta: "veloz",   opcoes: ["lento","veloz","alto","gordo"],      emoji: "💨" },
  { tipo: "sinônimo",  palavra: "começar",  resposta: "iniciar", opcoes: ["terminar","parar","iniciar","sair"], emoji: "▶️" },
  { tipo: "sinônimo",  palavra: "olhar",    resposta: "ver",     opcoes: ["falar","correr","ver","ouvir"],      emoji: "👀" },
  { tipo: "antônimo",  palavra: "quente",   resposta: "frio",    opcoes: ["morno","gelado","frio","úmido"],     emoji: "🌡️" },
  { tipo: "antônimo",  palavra: "grande",   resposta: "pequeno", opcoes: ["médio","alto","largo","pequeno"],    emoji: "📏" },
  { tipo: "antônimo",  palavra: "certo",    resposta: "errado",  opcoes: ["ótimo","bonito","errado","ruim"],    emoji: "✅" },
  { tipo: "antônimo",  palavra: "claro",    resposta: "escuro",  opcoes: ["azul","escuro","velho","sujo"],      emoji: "💡" },
  { tipo: "antônimo",  palavra: "cheio",    resposta: "vazio",   opcoes: ["vazio","limpo","novo","fraco"],      emoji: "🪣" },
];

// ── STATE ─────────────────────────────────────────────────────────────
let sec = 1, cur = 0, score = 0, won = false;

// ── SECTION 1: VERBOS ─────────────────────────────────────────────────
function renderVerbo() {
  const item = VERBOS[cur];
  const total = VERBOS.length + VOCABULARIO.length;
  const pct = Math.round((cur / total) * 100);
  const fraseHtml = item.frase.replace(/__(.+?)__/, '<strong style="color:#6d28d9;font-style:normal">$1</strong>');
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickVerbo(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === VERBOS.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Verbos ${cur+1} de ${VERBOS.length}</div>
    <div class="q-card">
      <div class="q-label">O verbo destacado está em qual tempo?</div>
      <div class="q-text" style="font-style:italic">"${fraseHtml}"</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextVerbo()">${nextLabel}</button>`;
}

function clickVerbo(btn, opcao) {
  if (won) return;
  const item = VERBOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! O verbo "${item.verbo}" está no ${item.resposta.toLowerCase()}.</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextVerbo() {
  cur++; won = false;
  if (cur >= VERBOS.length) { showTransitionVoc(); return; }
  renderVerbo();
}

// ── TRANSITION: VOCABULÁRIO ───────────────────────────────────────────
function showTransitionVoc() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">📚</span>
        <div class="transition-title">Arrasou!</div>
        <div class="transition-sub">Agora vamos com sinônimos e antônimos!</div>
      </div>
      <button class="continue-btn" onclick="startVoc()">Continuar →</button>
    </div>`;
}

function startVoc() { sec = 2; cur = 0; won = false; renderVocabulario(); }

// ── SECTION 2: VOCABULÁRIO ────────────────────────────────────────────
function renderVocabulario() {
  const item = VOCABULARIO[cur];
  const total = VERBOS.length + VOCABULARIO.length;
  const pct = Math.round(((VERBOS.length + cur) / total) * 100);
  const tipoLabel = item.tipo === "sinônimo" ? "Qual é o SINÔNIMO de" : "Qual é o ANTÔNIMO de";
  const tipoColor = item.tipo === "sinônimo" ? "#16a34a" : "#2563eb";
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickVoc(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === VOCABULARIO.length - 1 ? 'Ver resultado 🏆' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Vocabulário ${cur+1} de ${VOCABULARIO.length}</div>
    <div class="q-card">
      <div class="q-label" style="color:${tipoColor}">${tipoLabel}:</div>
      <div style="font-family:'Fredoka One',cursive;font-size:44px;text-align:center;margin:16px 0;color:#6d28d9">${item.emoji} ${item.palavra}</div>
    </div>
    <div class="options" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextVoc()">${nextLabel}</button>`;
}

function clickVoc(btn, opcao) {
  if (won) return;
  const item = VOCABULARIO[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ "${opcao}" é o ${item.tipo} de "${item.palavra}"!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextVoc() {
  cur++; won = false;
  if (cur >= VOCABULARIO.length) { showResult(); return; }
  renderVocabulario();
}

// ── RESULT SCREEN ─────────────────────────────────────────────────────
function showResult() {
  const total = VERBOS.length + VOCABULARIO.length;
  const correct = score / 10;
  let msg;
  if (correct === total)           msg = "Perfeito! Você domina os verbos e o vocabulário! 🌟";
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

// ── START SCREEN ──────────────────────────────────────────────────────
function startScreen() {
  sec = 1; cur = 0; score = 0; won = false;
  document.getElementById('score-val').textContent = 0;
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">📖</span>
      <div class="start-title">Verbos e <span>Vocabulário!</span></div>
      <div class="start-sub">Descubra o tempo dos verbos e teste seus sinônimos e antônimos!</div>
      <div class="start-facts">
        <div class="start-fact">⏰ 10 verbos</div>
        <div class="start-fact">📚 10 vocabulário</div>
      </div>
      <button class="start-btn" onclick="renderVerbo()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
</body>
</html>
