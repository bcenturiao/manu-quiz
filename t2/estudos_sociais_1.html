<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Estudos Sociais: Atividades Econômicas</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f97316;
    --orange-dark: #ea580c;
    --orange-light: #ffedd5;
    --yellow-light: #fef9c3;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #fed7aa;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--orange-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--orange); }
  .score-pill {
    background: var(--orange-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--orange), #fdba74);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--orange);
    background: var(--orange-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: var(--orange-light); border: 2px solid var(--orange-dark); }
  .fb-header { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: var(--orange-dark); }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: var(--orange-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #c2410c; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--orange-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #c2410c; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--orange-dark); margin-bottom: 6px; }
  .result-count { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--orange-light);
    border: 6px solid var(--orange);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--orange-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--orange-dark); font-weight: 700; }
  .result-msg { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--orange-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--orange-dark); margin-bottom: 8px; }
  .start-title span { color: var(--orange); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; font-family: 'Nunito', sans-serif; }
  .start-btn {
    background: var(--orange-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #c2410c; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 🌾</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const CONCEITOS = [
  { pergunta: "O que é agricultura?", resposta: "Trabalho de plantar e colher", opcoes: ["Trabalho de criar animais","Trabalho de plantar e colher","Atividade de comprar e vender"] },
  { pergunta: "O que é pecuária?", resposta: "Trabalho de criar animais para produção de alimentos", opcoes: ["Trabalho de criar animais para produção de alimentos","Trabalho de plantar e colher","Atividade de comprar e vender produtos"] },
  { pergunta: "O que é matéria-prima?", resposta: "Material da natureza usado para fabricar produtos", opcoes: ["Dinheiro usado para comprar produtos","Material da natureza usado para fabricar produtos","Nome de uma fábrica"] },
  { pergunta: "O que é comércio?", resposta: "Atividade de comprar e vender produtos e serviços", opcoes: ["Trabalho de criar animais","Trabalho de plantar e colher","Atividade de comprar e vender produtos e serviços"] },
];

const ATIVIDADES = [
  { pergunta: "Qual atividade é a criação de abelhas para produzir mel?", resposta: "Apicultura" },
  { pergunta: "Qual atividade é a criação de aves, como galinhas?", resposta: "Avicultura" },
  { pergunta: "Em Pelotas, essa atividade é praticada na Colônia Z-3. Qual é ela?", resposta: "Pesca" },
  { pergunta: "Qual atividade transforma a matéria-prima em produtos?", resposta: "Indústria" },
  { pergunta: "Qual atividade é o trabalho de plantar e colher?", resposta: "Agricultura" },
  { pergunta: "Qual atividade é o trabalho de criar animais para produzir alimentos?", resposta: "Pecuária" },
];
const OPCOES_ATIVIDADE = ["Agricultura", "Pecuária", "Apicultura", "Avicultura", "Pesca", "Indústria"];

const PECUARIA = [
  { pergunta: "Bovinos é a criação de quais animais?", resposta: "Vacas e bois" },
  { pergunta: "Suínos é a criação de quais animais?", resposta: "Porcos" },
  { pergunta: "Equinos é a criação de quais animais?", resposta: "Cavalos e éguas" },
  { pergunta: "Ovinos é a criação de quais animais?", resposta: "Ovelhas e carneiros" },
];
const OPCOES_PECUARIA = ["Vacas e bois", "Porcos", "Cavalos e éguas", "Ovelhas e carneiros"];

const PRODUTOS = [
  { pergunta: "De qual atividade vem o peixe?", resposta: "Pesca" },
  { pergunta: "De qual atividade vem o mel?", resposta: "Apicultura" },
  { pergunta: "De qual atividade vem o ovo?", resposta: "Avicultura" },
  { pergunta: "De qual atividade vem o couro?", resposta: "Pecuária" },
  { pergunta: "De qual atividade vem o arroz?", resposta: "Agricultura" },
];
const OPCOES_PRODUTO = ["Agricultura", "Pecuária", "Apicultura", "Avicultura", "Pesca"];

const MATERIA_PRIMA = [
  { pergunta: "Qual é a matéria-prima usada para fazer queijo?", resposta: "Leite", opcoes: ["Carne","Leite","Trigo"] },
  { pergunta: "Qual é a matéria-prima usada para fazer linguiça?", resposta: "Carne", opcoes: ["Carne","Leite","Algodão"] },
  { pergunta: "Qual é a matéria-prima usada para fazer farinha?", resposta: "Trigo", opcoes: ["Milho","Soja","Trigo"] },
  { pergunta: "Qual é a matéria-prima usada para fazer óleo?", resposta: "Soja", opcoes: ["Frutas","Soja","Trigo"] },
  { pergunta: "Qual é a matéria-prima usada para fazer sucos?", resposta: "Frutas", opcoes: ["Frutas","Leite","Trigo"] },
  { pergunta: "Qual é a matéria-prima usada para fazer borracha?", resposta: "Látex", opcoes: ["Látex","Madeira","Couro"] },
  { pergunta: "Qual é a matéria-prima usada para fazer móveis?", resposta: "Madeira", opcoes: ["Couro","Madeira","Algodão"] },
  { pergunta: "Qual é a matéria-prima usada para fazer sapatos?", resposta: "Couro", opcoes: ["Algodão","Couro","Látex"] },
  { pergunta: "Qual é a matéria-prima usada para fazer iogurte?", resposta: "Leite", opcoes: ["Trigo","Carne","Leite"] },
  { pergunta: "Qual é a matéria-prima usada para fazer roupas?", resposta: "Algodão", opcoes: ["Algodão","Couro","Madeira"] },
  { pergunta: "Qual é a matéria-prima usada para fazer pão?", resposta: "Trigo", opcoes: ["Trigo","Soja","Milho"] },
  { pergunta: "Qual é a matéria-prima usada para fazer presunto?", resposta: "Carne", opcoes: ["Leite","Carne","Trigo"] },
];

// ── STATE ─────────────────────────────────────────────────────────────
let sec = 1, cur = 0, score = 0, won = false, correctCount = 0;

// ── SECTION 1: CONCEITOS ───────────────────────────────────────────────
function renderConceitos() {
  const item = CONCEITOS[cur];
  const total = CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + MATERIA_PRIMA.length;
  const pct = Math.round((cur / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickConceitos(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === CONCEITOS.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Conceitos ${cur+1} de ${CONCEITOS.length}</div>
    <div class="q-card">
      <div class="q-label">Responda:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextConceitos()">${nextLabel}</button>`;
}

function clickConceitos(btn, opcao) {
  if (won) return;
  const item = CONCEITOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#ffedd5'; btn.style.borderColor = '#ea580c';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextConceitos() {
  cur++; won = false;
  if (cur >= CONCEITOS.length) { showTransitionAtividades(); return; }
  renderConceitos();
}

// ── TRANSITION: AS 6 ATIVIDADES ECONÔMICAS ────────────────────────────
function showTransitionAtividades() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🐝</span>
        <div class="transition-title">Muito bem!</div>
        <div class="transition-sub">Agora vamos descobrir as 6 atividades econômicas!</div>
      </div>
      <button class="continue-btn" onclick="startAtividades()">Continuar →</button>
    </div>`;
}

function startAtividades() { sec = 2; cur = 0; won = false; renderAtividades(); }

// ── SECTION 2: AS 6 ATIVIDADES ECONÔMICAS ─────────────────────────────
function renderAtividades() {
  const item = ATIVIDADES[cur];
  const total = CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + MATERIA_PRIMA.length;
  const pct = Math.round(((CONCEITOS.length + cur) / total) * 100);
  const optsHtml = OPCOES_ATIVIDADE.map(op =>
    `<button class="opt-btn" onclick="clickAtividades(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === ATIVIDADES.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Atividades Econômicas ${cur+1} de ${ATIVIDADES.length}</div>
    <div class="q-card">
      <div class="q-label">Responda:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextAtividades()">${nextLabel}</button>`;
}

function clickAtividades(btn, opcao) {
  if (won) return;
  const item = ATIVIDADES[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#ffedd5'; btn.style.borderColor = '#ea580c';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextAtividades() {
  cur++; won = false;
  if (cur >= ATIVIDADES.length) { showTransitionPecuaria(); return; }
  renderAtividades();
}

// ── TRANSITION: PECUÁRIA ──────────────────────────────────────────────
function showTransitionPecuaria() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🐄</span>
        <div class="transition-title">Arrasou!</div>
        <div class="transition-sub">Agora vamos falar dos animais da pecuária!</div>
      </div>
      <button class="continue-btn" onclick="startPecuaria()">Continuar →</button>
    </div>`;
}

function startPecuaria() { sec = 3; cur = 0; won = false; renderPecuaria(); }

// ── SECTION 3: PECUÁRIA — QUAIS ANIMAIS? ──────────────────────────────
function renderPecuaria() {
  const item = PECUARIA[cur];
  const total = CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + MATERIA_PRIMA.length;
  const pct = Math.round(((CONCEITOS.length + ATIVIDADES.length + cur) / total) * 100);
  const optsHtml = OPCOES_PECUARIA.map(op =>
    `<button class="opt-btn" onclick="clickPecuaria(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === PECUARIA.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Pecuária ${cur+1} de ${PECUARIA.length}</div>
    <div class="q-card">
      <div class="q-label">Responda:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextPecuaria()">${nextLabel}</button>`;
}

function clickPecuaria(btn, opcao) {
  if (won) return;
  const item = PECUARIA[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#ffedd5'; btn.style.borderColor = '#ea580c';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextPecuaria() {
  cur++; won = false;
  if (cur >= PECUARIA.length) { showTransitionProdutos(); return; }
  renderPecuaria();
}

// ── TRANSITION: PRODUTOS DE CADA ATIVIDADE ────────────────────────────
function showTransitionProdutos() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🐟</span>
        <div class="transition-title">Muito bem!</div>
        <div class="transition-sub">De qual atividade vem cada produto?</div>
      </div>
      <button class="continue-btn" onclick="startProdutos()">Continuar →</button>
    </div>`;
}

function startProdutos() { sec = 4; cur = 0; won = false; renderProdutos(); }

// ── SECTION 4: PRODUTOS DE CADA ATIVIDADE ─────────────────────────────
function renderProdutos() {
  const item = PRODUTOS[cur];
  const total = CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + MATERIA_PRIMA.length;
  const pct = Math.round(((CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + cur) / total) * 100);
  const optsHtml = OPCOES_PRODUTO.map(op =>
    `<button class="opt-btn" onclick="clickProdutos(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === PRODUTOS.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Produtos de Cada Atividade ${cur+1} de ${PRODUTOS.length}</div>
    <div class="q-card">
      <div class="q-label">Responda:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextProdutos()">${nextLabel}</button>`;
}

function clickProdutos(btn, opcao) {
  if (won) return;
  const item = PRODUTOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#ffedd5'; btn.style.borderColor = '#ea580c';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextProdutos() {
  cur++; won = false;
  if (cur >= PRODUTOS.length) { showTransitionMateriaPrima(); return; }
  renderProdutos();
}

// ── TRANSITION: MATÉRIA-PRIMA → PRODUTO ───────────────────────────────
function showTransitionMateriaPrima() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🧵</span>
        <div class="transition-title">Arrasou!</div>
        <div class="transition-sub">Última parte: de onde vem cada produto?</div>
      </div>
      <button class="continue-btn" onclick="startMateriaPrima()">Continuar →</button>
    </div>`;
}

function startMateriaPrima() { sec = 5; cur = 0; won = false; renderMateriaPrima(); }

// ── SECTION 5: MATÉRIA-PRIMA → PRODUTO ────────────────────────────────
function renderMateriaPrima() {
  const item = MATERIA_PRIMA[cur];
  const total = CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + MATERIA_PRIMA.length;
  const pct = Math.round(((CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + cur) / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickMateriaPrima(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === MATERIA_PRIMA.length - 1 ? 'Ver resultado 🏆' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Matéria-prima → Produto ${cur+1} de ${MATERIA_PRIMA.length}</div>
    <div class="q-card">
      <div class="q-label">Responda:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextMateriaPrima()">${nextLabel}</button>`;
}

function clickMateriaPrima(btn, opcao) {
  if (won) return;
  const item = MATERIA_PRIMA[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#ffedd5'; btn.style.borderColor = '#ea580c';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextMateriaPrima() {
  cur++; won = false;
  if (cur >= MATERIA_PRIMA.length) { showResult(); return; }
  renderMateriaPrima();
}

// ── RESULT SCREEN ─────────────────────────────────────────────────────
function showResult() {
  const total = CONCEITOS.length + ATIVIDADES.length + PECUARIA.length + PRODUTOS.length + MATERIA_PRIMA.length;
  const correct = correctCount;
  let msg;
  if (correct === total)           msg = "Perfeito! Você é expert em atividades econômicas! 🌟";
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

// ── START SCREEN ──────────────────────────────────────────────────────
function startScreen() {
  sec = 1; cur = 0; score = 0; won = false; correctCount = 0;
  document.getElementById('score-val').textContent = 0;
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">🌾</span>
      <div class="start-title">Atividades <span>Econômicas!</span></div>
      <div class="start-sub">Descubra agricultura, pecuária, apicultura, avicultura, pesca, indústria e de onde vêm os produtos!</div>
      <div class="start-facts">
        <div class="start-fact">📖 4 conceitos</div>
        <div class="start-fact">🐝 6 atividades</div>
        <div class="start-fact">🧵 12 matérias-primas</div>
      </div>
      <button class="start-btn" onclick="renderConceitos()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
</body>
</html>
