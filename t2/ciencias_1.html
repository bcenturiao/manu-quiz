<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Ciências: Diversidade Animal</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #22c55e;
    --green-dark: #16a34a;
    --green-light: #dcfce7;
    --yellow-light: #fef9c3;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #bbf7d0;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--green-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--green); }
  .score-pill {
    background: var(--green-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--green), #86efac);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--green);
    background: var(--green-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: #dcfce7; border: 2px solid #16a34a; }
  .fb-header { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: #15803d; }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #15803d; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--green-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #15803d; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--green-dark); margin-bottom: 6px; }
  .result-count { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--green-light);
    border: 6px solid var(--green);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--green-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--green-dark); font-weight: 700; }
  .result-msg { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--green-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--green-dark); margin-bottom: 8px; }
  .start-title span { color: var(--green); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; font-family: 'Nunito', sans-serif; }
  .start-btn {
    background: var(--green-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #15803d; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 🦋</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const VERT_INVERT = [
  { animal: "Besouro",        resposta: "Invertebrado", dica: "Besouro é um inseto, não tem coluna vertebral." },
  { animal: "Beija-flor",     resposta: "Vertebrado",   dica: "Beija-flor é uma ave, tem coluna vertebral." },
  { animal: "Estrela-do-mar", resposta: "Invertebrado", dica: "Estrela-do-mar é um equinodermo, não tem ossos." },
  { animal: "Golfinho",       resposta: "Vertebrado",   dica: "Golfinho é um mamífero, tem coluna vertebral." },
  { animal: "Aranha",         resposta: "Invertebrado", dica: "Aranha é um aracnídeo, tem esqueleto externo." },
  { animal: "Tartaruga",      resposta: "Vertebrado",   dica: "Tartaruga é um réptil, tem coluna vertebral." },
  { animal: "Polvo",          resposta: "Invertebrado", dica: "Polvo é um molusco, tem corpo mole." },
  { animal: "Sapo",           resposta: "Vertebrado",   dica: "Sapo é um anfíbio, tem coluna vertebral." },
  { animal: "Caranguejo",     resposta: "Invertebrado", dica: "Caranguejo é um crustáceo, tem esqueleto externo." },
  { animal: "Cavalo-marinho", resposta: "Vertebrado",   dica: "Cavalo-marinho é um peixe, tem coluna vertebral." },
];

const GRUPO_INVERTEBRADO = [
  { animal: "aranha",         resposta: "Artrópode",   dica: "Aranha tem esqueleto externo e pernas articuladas." },
  { animal: "minhoca",        resposta: "Anelídeo",    dica: "Minhoca tem corpo formado por anéis." },
  { animal: "água-viva",      resposta: "Cnidário",    dica: "Água-viva tem corpo gelatinoso." },
  { animal: "caracol",        resposta: "Molusco",     dica: "Caracol tem corpo mole e concha." },
  { animal: "estrela-do-mar", resposta: "Equinodermo", dica: "Estrela-do-mar vive só no mar e não tem cabeça nem cauda." },
  { animal: "anêmona",        resposta: "Cnidário",    dica: "Anêmona é parecida com a água-viva." },
  { animal: "polvo",          resposta: "Molusco",     dica: "Polvo tem corpo mole, como o caracol." },
  { animal: "lagosta",        resposta: "Artrópode",   dica: "Lagosta tem esqueleto externo e pernas articuladas." },
];
const OPCOES_GRUPO = ["Artrópode", "Anelídeo", "Cnidário", "Molusco", "Equinodermo"];

const ARTROPODE_TIPO = [
  { animal: "mosquito",      resposta: "Inseto",     dica: "Mosquito tem 6 pernas e 2 antenas." },
  { animal: "lagosta",       resposta: "Crustáceo",  dica: "Lagosta tem dez pernas e quatro antenas." },
  { animal: "escorpião",     resposta: "Aracnídeo",  dica: "Escorpião tem 8 pernas e não tem antenas." },
  { animal: "abelha",        resposta: "Inseto",     dica: "Abelha tem 6 pernas, 2 antenas e asas." },
  { animal: "caranguejo",    resposta: "Crustáceo",  dica: "Caranguejo tem dez pernas." },
  { animal: "carrapato",     resposta: "Aracnídeo",  dica: "Carrapato tem 8 pernas e não tem antenas." },
  { animal: "craca",         resposta: "Crustáceo",  dica: "Craca é um crustáceo que se fixa em rochas." },
  { animal: "louva-a-deus",  resposta: "Inseto",     dica: "Louva-a-deus tem 6 pernas e 2 antenas." },
];
const OPCOES_ARTROPODE = ["Inseto", "Crustáceo", "Aracnídeo"];

// ── STATE ─────────────────────────────────────────────────────────────
let sec = 1, cur = 0, score = 0, won = false, correctCount = 0;

// ── SECTION 1: VERTEBRADO OU INVERTEBRADO ────────────────────────────
function renderVertInvert() {
  const item = VERT_INVERT[cur];
  const total = VERT_INVERT.length + GRUPO_INVERTEBRADO.length + ARTROPODE_TIPO.length;
  const pct = Math.round((cur / total) * 100);
  const optsHtml = ["Vertebrado", "Invertebrado"].map(op =>
    `<button class="opt-btn" onclick="clickVertInvert(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === VERT_INVERT.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Vertebrado ou Invertebrado ${cur+1} de ${VERT_INVERT.length}</div>
    <div class="q-card">
      <div class="q-label">Esse animal é vertebrado ou invertebrado?</div>
      <div style="font-family:'Fredoka One',cursive;font-size:32px;text-align:center;margin:16px 0;color:#15803d">${item.animal}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextVertInvert()">${nextLabel}</button>`;
}

function clickVertInvert(btn, opcao) {
  if (won) return;
  const item = VERT_INVERT[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! ${item.dica}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextVertInvert() {
  cur++; won = false;
  if (cur >= VERT_INVERT.length) { showTransitionGrupo(); return; }
  renderVertInvert();
}

// ── TRANSITION: GRUPO DE INVERTEBRADOS ────────────────────────────────
function showTransitionGrupo() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🐌</span>
        <div class="transition-title">Muito bem!</div>
        <div class="transition-sub">Agora vamos descobrir os grupos de invertebrados!</div>
      </div>
      <button class="continue-btn" onclick="startGrupo()">Continuar →</button>
    </div>`;
}

function startGrupo() { sec = 2; cur = 0; won = false; renderGrupo(); }

// ── SECTION 2: GRUPO DE INVERTEBRADOS ────────────────────────────────
function renderGrupo() {
  const item = GRUPO_INVERTEBRADO[cur];
  const total = VERT_INVERT.length + GRUPO_INVERTEBRADO.length + ARTROPODE_TIPO.length;
  const pct = Math.round(((VERT_INVERT.length + cur) / total) * 100);
  const optsHtml = OPCOES_GRUPO.map(op =>
    `<button class="opt-btn" onclick="clickGrupo(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === GRUPO_INVERTEBRADO.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Grupo de Invertebrados ${cur+1} de ${GRUPO_INVERTEBRADO.length}</div>
    <div class="q-card">
      <div class="q-label">A qual grupo pertence:</div>
      <div style="font-family:'Fredoka One',cursive;font-size:32px;text-align:center;margin:16px 0;color:#15803d">${item.animal}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextGrupo()">${nextLabel}</button>`;
}

function clickGrupo(btn, opcao) {
  if (won) return;
  const item = GRUPO_INVERTEBRADO[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! ${item.dica}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextGrupo() {
  cur++; won = false;
  if (cur >= GRUPO_INVERTEBRADO.length) { showTransitionArtropode(); return; }
  renderGrupo();
}

// ── TRANSITION: TIPOS DE ARTRÓPODE ────────────────────────────────────
function showTransitionArtropode() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🕷️</span>
        <div class="transition-title">Arrasou!</div>
        <div class="transition-sub">Última parte: inseto, crustáceo ou aracnídeo?</div>
      </div>
      <button class="continue-btn" onclick="startArtropode()">Continuar →</button>
    </div>`;
}

function startArtropode() { sec = 3; cur = 0; won = false; renderArtropode(); }

// ── SECTION 3: TIPO DE ARTRÓPODE ──────────────────────────────────────
function renderArtropode() {
  const item = ARTROPODE_TIPO[cur];
  const total = VERT_INVERT.length + GRUPO_INVERTEBRADO.length + ARTROPODE_TIPO.length;
  const pct = Math.round(((VERT_INVERT.length + GRUPO_INVERTEBRADO.length + cur) / total) * 100);
  const optsHtml = OPCOES_ARTROPODE.map(op =>
    `<button class="opt-btn" onclick="clickArtropode(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === ARTROPODE_TIPO.length - 1 ? 'Ver resultado 🏆' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Tipos de Artrópode ${cur+1} de ${ARTROPODE_TIPO.length}</div>
    <div class="q-card">
      <div class="q-label">O(a) ${item.animal} é um:</div>
      <div style="font-family:'Fredoka One',cursive;font-size:28px;text-align:center;margin:16px 0;color:#15803d">${item.animal}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextArtropode()">${nextLabel}</button>`;
}

function clickArtropode(btn, opcao) {
  if (won) return;
  const item = ARTROPODE_TIPO[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! ${item.dica}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextArtropode() {
  cur++; won = false;
  if (cur >= ARTROPODE_TIPO.length) { showResult(); return; }
  renderArtropode();
}

// ── RESULT SCREEN ─────────────────────────────────────────────────────
function showResult() {
  const total = VERT_INVERT.length + GRUPO_INVERTEBRADO.length + ARTROPODE_TIPO.length;
  const correct = correctCount;
  let msg;
  if (correct === total)           msg = "Perfeito! Você é expert em animais! 🌟";
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

// ── START SCREEN ──────────────────────────────────────────────────────
function startScreen() {
  sec = 1; cur = 0; score = 0; won = false; correctCount = 0;
  document.getElementById('score-val').textContent = 0;
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">🦋</span>
      <div class="start-title">Diversidade <span>Animal!</span></div>
      <div class="start-sub">Descubra quem são os vertebrados, os invertebrados e os grupos de cada um!</div>
      <div class="start-facts">
        <div class="start-fact">🐾 10 vert/invert</div>
        <div class="start-fact">🐌 8 grupos</div>
        <div class="start-fact">🕷️ 8 artrópodes</div>
      </div>
      <button class="start-btn" onclick="renderVertInvert()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
