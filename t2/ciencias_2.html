<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Ciências: Ossos e Músculos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #22c55e;
    --green-dark: #16a34a;
    --green-light: #dcfce7;
    --yellow-light: #fef9c3;
    --bg: #fffbf0;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #bbf7d0;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--green-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--green); }
  .score-pill {
    background: var(--green-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--green), #86efac);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-family: 'Nunito', sans-serif;
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--green);
    background: var(--green-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: #dcfce7; border: 2px solid #16a34a; }
  .fb-header { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: #15803d; }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #15803d; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--green-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #15803d; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--green-dark); margin-bottom: 6px; }
  .result-count { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--green-light);
    border: 6px solid var(--green);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--green-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--green-dark); font-weight: 700; }
  .result-msg { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--green);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--green-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--green-dark); margin-bottom: 8px; }
  .start-title span { color: var(--green); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; font-family: 'Nunito', sans-serif; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; font-family: 'Nunito', sans-serif; }
  .start-btn {
    background: var(--green-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #15803d; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 🦴</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const OSSOS = [
  { pergunta: "Qual é a função dos ossos, junto com os músculos?", resposta: "Movimentar o corpo", opcoes: ["Movimentar o corpo","Produzir hormônios","Fazer a digestão","Bombear o sangue"] },
  { pergunta: "O que protege o cérebro?", resposta: "O crânio", opcoes: ["O crânio","A coluna vertebral","As costelas","O fêmur"] },
  { pergunta: "O que fica dentro dos ossos e produz células do sangue?", resposta: "A medula óssea", opcoes: ["A medula óssea","O osso compacto","A cartilagem","O tendão"] },
  { pergunta: "Além de minerais como o cálcio, o que mais os ossos têm?", resposta: "Nervos e vasos sanguíneos", opcoes: ["Nervos e vasos sanguíneos","Somente ar","Somente água","Pele e pelos"] },
  { pergunta: "Por que sentimos dor quando batemos a perna em um móvel?", resposta: "Porque os ossos têm nervos", opcoes: ["Porque os ossos têm nervos","Porque os ossos são ocos","Porque os ossos são frágeis","Porque os músculos têm cálcio"] },
  { pergunta: "O conjunto de todos os ossos do corpo forma o quê?", resposta: "O esqueleto", opcoes: ["O esqueleto","O sistema nervoso","A musculatura","A pele"] },
  { pergunta: "Que mineral está presente nos ossos e os deixa mais resistentes?", resposta: "Cálcio", opcoes: ["Cálcio","Ferro","Sódio","Iodo"] },
  { pergunta: "Além de proteger os órgãos internos, o que mais os ossos fazem pelo corpo?", resposta: "Sustentam o corpo", opcoes: ["Sustentam o corpo","Produzem saliva","Fazem a respiração","Filtram o sangue"] },
];

const ESQUELETO = [
  { pergunta: "O que protege o cérebro e outros órgãos da cabeça?", resposta: "O crânio", opcoes: ["O crânio","O fêmur","A escápula","O esterno"] },
  { pergunta: "O que liga o braço à caixa torácica?", resposta: "A clavícula e a escápula", opcoes: ["A clavícula e a escápula","A tíbia e a fíbula","O crânio","As costelas"] },
  { pergunta: "O que forma a caixa torácica e protege os pulmões e o coração?", resposta: "As costelas e o esterno", opcoes: ["As costelas e o esterno","O fêmur","A coluna vertebral","O crânio"] },
  { pergunta: "Qual osso sustenta a coxa?", resposta: "O fêmur", opcoes: ["O fêmur","A tíbia","O esterno","A escápula"] },
  { pergunta: "Quais ossos da perna ajudam a sustentar e equilibrar o corpo?", resposta: "A tíbia e a fíbula", opcoes: ["A tíbia e a fíbula","O fêmur e o crânio","As costelas e o esterno","A clavícula e a escápula"] },
  { pergunta: "O que permite os movimentos do tronco e do pescoço e protege a medula e os nervos espinais?", resposta: "A coluna vertebral", opcoes: ["A coluna vertebral","O crânio","O fêmur","As costelas"] },
  { pergunta: "O que são os pontos de apoio que sustentam o corpo em pé?", resposta: "Os ossos do pé", opcoes: ["Os ossos do pé","Os ossos da mão","O crânio","A coluna vertebral"] },
  { pergunta: "Como se chamam os pontos em que os ossos se encaixam, permitindo os movimentos?", resposta: "Articulações", opcoes: ["Articulações","Tendões","Músculos","Nervos"] },
];

const MUSCULOS = [
  { pergunta: "Os músculos que se movem pela nossa vontade são chamados de quê?", resposta: "Voluntários", opcoes: ["Voluntários","Involuntários","Rígidos","Flexíveis"] },
  { pergunta: "O coração é um músculo voluntário ou involuntário?", resposta: "Involuntário", opcoes: ["Involuntário","Voluntário","Nenhum dos dois","Os dois ao mesmo tempo"] },
  { pergunta: "O que liga os músculos aos ossos?", resposta: "Os tendões", opcoes: ["Os tendões","As articulações","Os nervos","Os vasos sanguíneos"] },
  { pergunta: "Quando o músculo fica curto e grosso, ele está...", resposta: "Contraído", opcoes: ["Contraído","Relaxado","Rompido","Dormente"] },
  { pergunta: "Quando o músculo fica fino e longo, ele está...", resposta: "Relaxado", opcoes: ["Relaxado","Contraído","Rompido","Dormente"] },
  { pergunta: "Os músculos do estômago e do intestino são voluntários ou involuntários?", resposta: "Involuntários", opcoes: ["Involuntários","Voluntários","Não existem músculos ali","São ossos"] },
  { pergunta: "Que músculo bombeia o sangue para todo o corpo?", resposta: "O coração", opcoes: ["O coração","O estômago","O pulmão","O fígado"] },
  { pergunta: "Que tipo de músculos movimentam braços, pernas e partes do rosto por nossa vontade?", resposta: "Músculos voluntários", opcoes: ["Músculos voluntários","Músculos involuntários","Ossos","Tendões"] },
];

// ── STATE ─────────────────────────────────────────────────────────────
let sec = 1, cur = 0, score = 0, won = false, correctCount = 0;

// ── SECTION 1: FUNÇÃO E ESTRUTURA DOS OSSOS ──────────────────────────
function renderOssos() {
  const item = OSSOS[cur];
  const total = OSSOS.length + ESQUELETO.length + MUSCULOS.length;
  const pct = Math.round((cur / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickOssos(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === OSSOS.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Ossos ${cur+1} de ${OSSOS.length}</div>
    <div class="q-card">
      <div class="q-label">Sobre os ossos:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextOssos()">${nextLabel}</button>`;
}

function clickOssos(btn, opcao) {
  if (won) return;
  const item = OSSOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextOssos() {
  cur++; won = false;
  if (cur >= OSSOS.length) { showTransitionEsqueleto(); return; }
  renderOssos();
}

// ── TRANSITION: ESQUELETO HUMANO ──────────────────────────────────────
function showTransitionEsqueleto() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🦴</span>
        <div class="transition-title">Muito bem!</div>
        <div class="transition-sub">Agora vamos conhecer o esqueleto humano!</div>
      </div>
      <button class="continue-btn" onclick="startEsqueleto()">Continuar →</button>
    </div>`;
}

function startEsqueleto() { sec = 2; cur = 0; won = false; renderEsqueleto(); }

// ── SECTION 2: ESQUELETO HUMANO ───────────────────────────────────────
function renderEsqueleto() {
  const item = ESQUELETO[cur];
  const total = OSSOS.length + ESQUELETO.length + MUSCULOS.length;
  const pct = Math.round(((OSSOS.length + cur) / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickEsqueleto(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === ESQUELETO.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Esqueleto Humano ${cur+1} de ${ESQUELETO.length}</div>
    <div class="q-card">
      <div class="q-label">Sobre o esqueleto:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextEsqueleto()">${nextLabel}</button>`;
}

function clickEsqueleto(btn, opcao) {
  if (won) return;
  const item = ESQUELETO[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextEsqueleto() {
  cur++; won = false;
  if (cur >= ESQUELETO.length) { showTransitionMusculos(); return; }
  renderEsqueleto();
}

// ── TRANSITION: MÚSCULOS ──────────────────────────────────────────────
function showTransitionMusculos() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">💪</span>
        <div class="transition-title">Arrasou!</div>
        <div class="transition-sub">Última parte: vamos falar de músculos!</div>
      </div>
      <button class="continue-btn" onclick="startMusculos()">Continuar →</button>
    </div>`;
}

function startMusculos() { sec = 3; cur = 0; won = false; renderMusculos(); }

// ── SECTION 3: MÚSCULOS ───────────────────────────────────────────────
function renderMusculos() {
  const item = MUSCULOS[cur];
  const total = OSSOS.length + ESQUELETO.length + MUSCULOS.length;
  const pct = Math.round(((OSSOS.length + ESQUELETO.length + cur) / total) * 100);
  const optsHtml = item.opcoes.map(op =>
    `<button class="opt-btn" onclick="clickMusculos(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === MUSCULOS.length - 1 ? 'Ver resultado 🏆' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Músculos ${cur+1} de ${MUSCULOS.length}</div>
    <div class="q-card">
      <div class="q-label">Sobre os músculos:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextMusculos()">${nextLabel}</button>`;
}

function clickMusculos(btn, opcao) {
  if (won) return;
  const item = MUSCULOS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#dcfce7'; btn.style.borderColor = '#16a34a';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextMusculos() {
  cur++; won = false;
  if (cur >= MUSCULOS.length) { showResult(); return; }
  renderMusculos();
}

// ── RESULT SCREEN ─────────────────────────────────────────────────────
function showResult() {
  const total = OSSOS.length + ESQUELETO.length + MUSCULOS.length;
  const correct = correctCount;
  let msg;
  if (correct === total)           msg = "Perfeito! Você é expert em ossos e músculos! 🌟";
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

// ── START SCREEN ──────────────────────────────────────────────────────
function startScreen() {
  sec = 1; cur = 0; score = 0; won = false; correctCount = 0;
  document.getElementById('score-val').textContent = 0;
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">🦴</span>
      <div class="start-title">Ossos e <span>Músculos!</span></div>
      <div class="start-sub">Descubra como o esqueleto e os músculos sustentam e movimentam o corpo!</div>
      <div class="start-facts">
        <div class="start-fact">🦴 8 ossos</div>
        <div class="start-fact">💀 8 esqueleto</div>
        <div class="start-fact">💪 8 músculos</div>
      </div>
      <button class="start-btn" onclick="renderOssos()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
</body>
</html>
