<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz da Manu — Inglês: Guia de Estudos</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #db2777;
    --pink-dark: #be185d;
    --pink-light: #fce7f3;
    --yellow-light: #fef9c3;
    --bg: #fff5fb;
    --card: #ffffff;
    --text: #1e1b0e;
    --text-soft: #6b7280;
    --radius: 20px;
    --radius-lg: 28px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Verdana, Geneva, sans-serif;
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -80px; right: -80px;
    width: 320px; height: 320px;
    background: #fbcfe8;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.5;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -100px; left: -80px;
    width: 360px; height: 360px;
    background: #fde68a;
    border-radius: 50%;
    z-index: 0;
    opacity: 0.4;
  }

  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: var(--pink-dark);
    letter-spacing: 0.5px;
  }
  .logo span { color: var(--pink); }
  .score-pill {
    background: var(--pink-dark);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    padding: 8px 20px;
    border-radius: 50px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .progress-wrap {
    background: #e5e7eb;
    border-radius: 50px;
    height: 10px;
    margin-bottom: 6px;
    overflow: hidden;
  }
  .progress-fill {
    height: 10px;
    background: linear-gradient(90deg, var(--pink), #f9a8d4);
    border-radius: 50px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
  }
  .progress-label {
    font-size: 12px;
    color: var(--text-soft);
    font-weight: 700;
    text-align: right;
    margin-bottom: 16px;
  }

  .q-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    border: 3px solid #e5e7eb;
    margin-bottom: 14px;
    animation: popIn 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-soft);
    text-align: center;
    margin-bottom: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .q-text {
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    text-align: center;
    line-height: 1.4;
  }
  .blank { color: var(--pink-dark); text-decoration: underline; font-style: italic; letter-spacing: 2px; }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 14px;
  }
  .opt-btn {
    background: #f9fafb;
    border: 3px solid #e5e7eb;
    border-radius: var(--radius);
    padding: 18px;
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--pink);
    background: var(--pink-light);
    transform: scale(1.02);
  }
  .opt-btn:active:not(:disabled) { transform: scale(0.97); }
  .opt-btn:disabled { cursor: default; }

  /* Feedback panel */
  .feedback-panel {
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
    display: none;
    animation: popIn 0.3s ease;
  }
  .feedback-panel.show { display: block; }
  .feedback-panel.ok  { background: var(--pink-light); border: 2px solid var(--pink-dark); }
  .fb-header { font-size: 15px; font-weight: 900; margin-bottom: 4px; }
  .feedback-panel.ok .fb-header { color: var(--pink-dark); }

  /* Next button */
  .next-btn {
    display: none;
    width: 100%;
    background: var(--pink-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 18px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    margin-top: 4px;
  }
  .next-btn.show { display: block; animation: popIn 0.3s ease; }
  .next-btn:hover { background: #9d174d; transform: scale(1.02); }
  .next-btn:active { transform: scale(0.98); }

  /* Transition screen */
  .transition-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .transition-banner {
    background: #fef9c3;
    border: 2px dashed #f59e0b;
    color: #92400e;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .transition-emoji { font-size: 72px; display: block; margin-bottom: 12px; }
  .transition-title { font-family: 'Fredoka One', cursive; font-size: 24px; color: #92400e; margin-bottom: 8px; }
  .transition-sub { font-size: 14px; color: #92400e; line-height: 1.5; }
  .continue-btn {
    width: 100%;
    background: var(--pink-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .continue-btn:hover { background: #9d174d; transform: scale(1.02); }
  .continue-btn:active { transform: scale(0.97); }

  /* Result screen */
  .result-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .result-trophy { font-size: 90px; display: block; margin-bottom: 12px; }
  .result-title { font-family: 'Fredoka One', cursive; font-size: 30px; color: var(--pink-dark); margin-bottom: 6px; }
  .result-count { font-size: 16px; font-weight: 700; color: var(--text-soft); margin-bottom: 16px; }
  .result-score-ring {
    width: 140px; height: 140px;
    border-radius: 50%;
    background: var(--pink-light);
    border: 6px solid var(--pink);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .result-score-ring .big { font-family: 'Fredoka One', cursive; font-size: 42px; color: var(--pink-dark); line-height: 1; }
  .result-score-ring .small { font-size: 13px; color: var(--pink-dark); font-weight: 700; }
  .result-msg { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 28px; line-height: 1.4; }
  .restart-btn {
    background: var(--pink);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
    width: 100%;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .restart-btn:hover { background: var(--pink-dark); transform: scale(1.02); }
  .restart-btn:active { transform: scale(0.97); }

  /* Start screen */
  .start-screen {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 36px 24px;
    text-align: center;
    border: 3px solid #e5e7eb;
    animation: popIn 0.4s ease;
  }
  .start-animal { font-size: 80px; display: block; margin-bottom: 8px; }
  .start-title { font-family: 'Fredoka One', cursive; font-size: 32px; color: var(--pink-dark); margin-bottom: 8px; }
  .start-title span { color: var(--pink); }
  .start-sub { font-size: 15px; color: var(--text-soft); font-weight: 600; margin-bottom: 28px; line-height: 1.5; }
  .start-facts { display: flex; gap: 12px; justify-content: center; margin-bottom: 28px; flex-wrap: wrap; }
  .start-fact { background: var(--yellow-light); border-radius: var(--radius); padding: 10px 16px; font-size: 13px; font-weight: 700; color: #92400e; }
  .start-btn {
    background: var(--pink-dark);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 20px 40px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: background 0.2s, transform 0.15s;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  .start-btn:hover { background: #9d174d; transform: scale(1.02); }
  .start-btn:active { transform: scale(0.97); }

  @media (max-width: 500px) {
    .opt-btn { font-size: 15px; padding: 14px; }
    .q-text { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="topbar">
    <div class="logo">Manu<span>Quiz</span> 🇬🇧</div>
    <div class="score-pill" id="score-pill">
      <span>⭐</span>
      <span id="score-val">0</span> pts
    </div>
  </div>
  <div id="app"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────────────────
const CONJUNCTIONS = [
  { pergunta: "She likes pizza ___ chocolate.", resposta: "AND", dica: "Ela gosta de pizza E chocolate — soma ideias parecidas." },
  { pergunta: "He plays soccer, ___ he doesn't play video games.", resposta: "BUT", dica: "Ele joga futebol, MAS não joga videogame — contrasta ideias." },
  { pergunta: "They have a dog ___ a cat.", resposta: "AND", dica: "Eles têm um cachorro E um gato — soma ideias parecidas." },
  { pergunta: "I like reading ___ writing.", resposta: "AND", dica: "Eu gosto de ler E escrever — soma ideias parecidas." },
  { pergunta: "He eats apples, ___ he doesn't eat salad.", resposta: "BUT", dica: "Ele come maçãs, MAS não come salada — contrasta ideias." },
  { pergunta: "She wants to go to the park, ___ it's raining.", resposta: "BUT", dica: "Ela quer ir ao parque, MAS está chovendo — contrasta ideias." },
  { pergunta: "The flat has a kitchen ___ a bathroom.", resposta: "AND", dica: "O apartamento tem cozinha E banheiro — soma ideias parecidas." },
  { pergunta: "He likes the shop, ___ he doesn't have money.", resposta: "BUT", dica: "Ele gosta da loja, MAS não tem dinheiro — contrasta ideias." },
];
const OPCOES_CONJ = ["AND", "BUT"];

const PLACES = [
  { pergunta: "Where can you buy things?", resposta: "Shop / Store" },
  { pergunta: "Where can you eat?", resposta: "Restaurant" },
  { pergunta: "Where can you play?", resposta: "Park" },
  { pergunta: "Where can you live?", resposta: "Flat" },
  { pergunta: "Where can you see cars?", resposta: "Street" },
  { pergunta: "Where can you see flowers and trees?", resposta: "Garden" },
];
const OPCOES_PLACES = ["Shop / Store", "Restaurant", "Park", "Flat", "Street", "Garden"];

const SONS = [
  { palavra: "Plays", resposta: "PL", dica: "joga / brinca" },
  { palavra: "Flower", resposta: "FL", dica: "flor" },
  { palavra: "Blue", resposta: "BL", dica: "azul" },
  { palavra: "Plane", resposta: "PL", dica: "avião" },
  { palavra: "Black", resposta: "BL", dica: "preto" },
  { palavra: "Flies", resposta: "FL", dica: "voa" },
  { palavra: "Plants", resposta: "PL", dica: "plantas" },
  { palavra: "Flat", resposta: "FL", dica: "apartamento" },
];
const OPCOES_SOM = ["BL", "PL", "FL"];

// ── STATE ─────────────────────────────────────────────────────────────
let sec = 1, cur = 0, score = 0, won = false, correctCount = 0;

// ── SECTION 1: CONJUNCTIONS — AND OU BUT? ─────────────────────────────
function renderConjunctions() {
  const item = CONJUNCTIONS[cur];
  const total = CONJUNCTIONS.length + PLACES.length + SONS.length;
  const pct = Math.round((cur / total) * 100);
  const optsHtml = OPCOES_CONJ.map(op =>
    `<button class="opt-btn" onclick="clickConjunctions(this,'${op}')">${op}</button>`
  ).join('');
  const sentence = item.pergunta.replace('___', '<span class="blank">___</span>');
  const nextLabel = cur === CONJUNCTIONS.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Conjunctions ${cur+1} de ${CONJUNCTIONS.length}</div>
    <div class="q-card">
      <div class="q-label">Complete a frase:</div>
      <div class="q-text">${sentence}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextConjunctions()">${nextLabel}</button>`;
}

function clickConjunctions(btn, opcao) {
  if (won) return;
  const item = CONJUNCTIONS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#fce7f3'; btn.style.borderColor = '#be185d';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! ${item.dica}</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextConjunctions() {
  cur++; won = false;
  if (cur >= CONJUNCTIONS.length) { showTransitionPlaces(); return; }
  renderConjunctions();
}

// ── TRANSITION: PLACES VOCABULARY ─────────────────────────────────────
function showTransitionPlaces() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🏙️</span>
        <div class="transition-title">Muito bem!</div>
        <div class="transition-sub">Agora vamos aprender o vocabulário de lugares!</div>
      </div>
      <button class="continue-btn" onclick="startPlaces()">Continuar →</button>
    </div>`;
}

function startPlaces() { sec = 2; cur = 0; won = false; renderPlaces(); }

// ── SECTION 2: PLACES VOCABULARY ──────────────────────────────────────
function renderPlaces() {
  const item = PLACES[cur];
  const total = CONJUNCTIONS.length + PLACES.length + SONS.length;
  const pct = Math.round(((CONJUNCTIONS.length + cur) / total) * 100);
  const optsHtml = OPCOES_PLACES.map(op =>
    `<button class="opt-btn" onclick="clickPlaces(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === PLACES.length - 1 ? 'Próxima parte →' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Places Vocabulary ${cur+1} de ${PLACES.length}</div>
    <div class="q-card">
      <div class="q-label">Responda:</div>
      <div class="q-text">${item.pergunta}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextPlaces()">${nextLabel}</button>`;
}

function clickPlaces(btn, opcao) {
  if (won) return;
  const item = PLACES[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#fce7f3'; btn.style.borderColor = '#be185d';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}!</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextPlaces() {
  cur++; won = false;
  if (cur >= PLACES.length) { showTransitionSons(); return; }
  renderPlaces();
}

// ── TRANSITION: SONS COMBINADOS ────────────────────────────────────────
function showTransitionSons() {
  document.getElementById('app').innerHTML = `
    <div class="transition-screen">
      <div class="transition-banner">
        <span class="transition-emoji">🔤</span>
        <div class="transition-title">Arrasou!</div>
        <div class="transition-sub">Última parte: sons combinados BL, PL e FL!</div>
      </div>
      <button class="continue-btn" onclick="startSons()">Continuar →</button>
    </div>`;
}

function startSons() { sec = 3; cur = 0; won = false; renderSons(); }

// ── SECTION 3: SONS COMBINADOS — BL, PL OU FL? ────────────────────────
function renderSons() {
  const item = SONS[cur];
  const total = CONJUNCTIONS.length + PLACES.length + SONS.length;
  const pct = Math.round(((CONJUNCTIONS.length + PLACES.length + cur) / total) * 100);
  const optsHtml = OPCOES_SOM.map(op =>
    `<button class="opt-btn" onclick="clickSons(this,'${op}')">${op}</button>`
  ).join('');
  const nextLabel = cur === SONS.length - 1 ? 'Ver resultado 🏆' : 'Próxima →';
  document.getElementById('app').innerHTML = `
    <div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>
    <div class="progress-label">Sons Combinados ${cur+1} de ${SONS.length}</div>
    <div class="q-card">
      <div class="q-label">Qual é o som inicial de:</div>
      <div style="font-family:'Fredoka One',cursive;font-size:32px;text-align:center;margin:16px 0;color:var(--pink-dark)">${item.palavra}</div>
    </div>
    <div class="options">${optsHtml}</div>
    <div class="feedback-panel" id="fb"></div>
    <button class="next-btn" id="next-btn" onclick="nextSons()">${nextLabel}</button>`;
}

function clickSons(btn, opcao) {
  if (won) return;
  const item = SONS[cur];
  const allBtns = document.querySelectorAll('.opt-btn');
  if (opcao === item.resposta) {
    won = true; score += 10; correctCount++; document.getElementById('score-val').textContent = score;
    btn.style.background = '#fce7f3'; btn.style.borderColor = '#be185d';
    document.getElementById('fb').className = 'feedback-panel show ok';
    document.getElementById('fb').innerHTML = `<div class="fb-header">✓ ${item.resposta}! "${item.palavra}" = ${item.dica}.</div>`;
    document.getElementById('next-btn').className = 'next-btn show';
    allBtns.forEach(b => b.disabled = true);
  } else {
    btn.style.background = '#fee2e2'; btn.style.borderColor = '#ef4444'; btn.disabled = true;
  }
}

function nextSons() {
  cur++; won = false;
  if (cur >= SONS.length) { showResult(); return; }
  renderSons();
}

// ── RESULT SCREEN ─────────────────────────────────────────────────────
function showResult() {
  const total = CONJUNCTIONS.length + PLACES.length + SONS.length;
  const correct = correctCount;
  let msg;
  if (correct === total)           msg = "Perfeito! Você domina o guia de estudos! 🌟";
  else if (correct >= total * 0.8) msg = "Muito bem! Quase tudo certo! 💪";
  else if (correct >= total * 0.6) msg = "Bom trabalho! Continue praticando! 📚";
  else                             msg = "Continue tentando — você vai melhorar! 🌈";
  document.getElementById('app').innerHTML = `
    <div class="result-screen">
      <span class="result-trophy">🏆</span>
      <div class="result-title">Você foi incrível!</div>
      <div class="result-count">Você acertou ${correct} de ${total} questões!</div>
      <div class="result-score-ring">
        <span class="big">${score}</span>
        <span class="small">pontos</span>
      </div>
      <div class="result-msg">${msg}</div>
      <button class="restart-btn" onclick="startScreen()">🔄 Jogar de novo</button>
    </div>`;
}

// ── START SCREEN ──────────────────────────────────────────────────────
function startScreen() {
  sec = 1; cur = 0; score = 0; won = false; correctCount = 0;
  document.getElementById('score-val').textContent = 0;
  document.getElementById('app').innerHTML = `
    <div class="start-screen">
      <span class="start-animal">🇬🇧</span>
      <div class="start-title">Guia de <span>Estudos!</span></div>
      <div class="start-sub">Pratique AND/BUT, o vocabulário de lugares e os sons BL, PL e FL!</div>
      <div class="start-facts">
        <div class="start-fact">🔗 8 AND/BUT</div>
        <div class="start-fact">🏙️ 6 lugares</div>
        <div class="start-fact">🔤 8 sons</div>
      </div>
      <button class="start-btn" onclick="renderConjunctions()">Vamos começar! 🚀</button>
    </div>`;
}

startScreen();
</script>
</body>
</html>
